<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPFLEX Live Pricing Calculator</title>
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Local Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="min-h-screen p-4 md:p-8">
        <div class="max-w-6xl mx-auto">
            <!-- Header -->
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div class="flex items-center gap-8">
                    <div class="flex items-center gap-3 select-none">
                        <div class="bg-zinc-900 p-2 rounded-lg">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xl font-black tracking-tighter leading-none uppercase">LPFLEX</span>
                            <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest mt-1">Live Pricing</span>
                        </div>
                    </div>
                    
                    <button id="resetBtn" class="flex items-center gap-2 px-3 py-1.5 text-xs font-bold text-zinc-500 hover:text-zinc-900 hover:bg-zinc-200 rounded-lg transition-all border border-transparent hover:border-zinc-300 active:scale-95">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                        Reset
                    </button>
                </div>
                
                <div id="statusBadgeContainer" class="hidden">
                    <span id="statusBadge" class="px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider flex items-center gap-2 shadow-sm">
                        <div id="statusPulse" class="w-2 h-2 rounded-full animate-pulse"></div>
                        <span id="statusText"></span>
                    </span>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <main class="lg:col-span-8 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Financial Input -->
                        <div class="bg-white p-6 rounded-2xl border border-zinc-200 shadow-sm flex flex-col justify-center">
                            <h3 class="text-sm font-semibold mb-6 flex items-center gap-2 uppercase tracking-wide">
                                <i data-lucide="wallet" class="w-4 h-4 text-blue-600"></i> Financial Input
                            </h3>
                            <div class="space-y-3">
                                <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Raw Material Cost (AED)</label>
                                <input id="materialInput" type="number" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-4 py-5 text-3xl font-black text-blue-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-inner" placeholder="0">
                            </div>
                        </div>

                        <!-- Parameter Selectors -->
                        <div class="bg-white p-6 rounded-2xl border border-zinc-200 shadow-sm space-y-6">
                            <div class="space-y-3">
                                <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="briefcase" class="w-3.5 h-3.5 text-blue-500"></i> Project Type
                                </label>
                                <div id="projectTypes" class="grid grid-cols-2 gap-2"></div>
                            </div>

                            <div class="space-y-3">
                                <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="hard-hat" class="w-3.5 h-3.5 text-blue-500"></i> Labour Intensity
                                </label>
                                <div id="labourIntensity" class="flex gap-2"></div>
                            </div>

                            <div class="space-y-3">
                                <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="truck" class="w-3.5 h-3.5 text-blue-500"></i> Installation
                                </label>
                                <div id="installationComplexity" class="flex gap-2"></div>
                            </div>

                            <div class="space-y-3">
                                <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-blue-500"></i> Authority Risk
                                </label>
                                <div id="authorityRisk" class="flex gap-2"></div>
                            </div>
                        </div>
                    </div>
                </main>

                <!-- Sidebar Summary -->
                <aside class="lg:col-span-4">
                    <div class="bg-zinc-900 text-white rounded-3xl p-8 shadow-2xl lg:sticky lg:top-8 border border-white/5">
                        <h2 class="text-lg font-bold mb-6 uppercase tracking-tighter text-zinc-400 text-center">Pricing Summary</h2>
                        <div class="space-y-6">
                            <div>
                                <span class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.2em] block mb-1">Final Price</span>
                                <div class="flex items-baseline gap-2">
                                    <span id="sidebarFinalPriceDisplay" class="text-4xl font-black tracking-tighter transition-colors duration-300 text-blue-400">0</span>
                                    <span class="text-zinc-600 text-xs font-bold uppercase">AED</span>
                                </div>
                            </div>

                            <div class="border-t border-white/10 pt-6 space-y-4">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="text-zinc-500 font-medium tracking-wide">Base Price</span>
                                    <span class="font-mono text-zinc-300">AED <span id="basePriceDisplay">0</span></span>
                                </div>
                            </div>

                            <div class="bg-white/5 rounded-2xl p-5 space-y-3 border border-white/5">
                                <div class="flex justify-between text-[10px] font-mono uppercase tracking-widest">
                                    <span class="text-zinc-500">Commercial Status</span>
                                    <span id="commercialStatusDisplay" class="font-bold">—</span>
                                </div>
                                <div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
                                    <div id="progressBar" class="h-full transition-all duration-1000 w-0"></div>
                                </div>
                                <div class="flex justify-between items-center text-[10px]">
                                    <span class="text-zinc-500 uppercase tracking-widest">Factory Price</span>
                                    <span class="text-zinc-300 font-bold tracking-tight">AED <span id="factoryPriceDisplay">0</span></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </div>
    <!-- Local Logic -->
    <script src="script.js"></script>
</body>
</html>
